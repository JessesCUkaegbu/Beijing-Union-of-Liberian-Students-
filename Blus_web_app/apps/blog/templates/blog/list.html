{% extends "base.html" %}

{% block title %}Blog{% endblock %}

{% block content %}
<section class="space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Blog</h1>
        <a href="{% url 'blog:add' %}" class="rounded bg-slate-900 px-4 py-2 text-white">Add post</a>
    </div>
    <div class="rounded-lg bg-white p-6 shadow">
        {% for post in posts %}
            <p><a href="{% url 'blog:detail' post.slug %}" class="font-medium text-slate-900">{{ post.title }}</a></p>
        {% empty %}
            <p>No posts published yet.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
