{% extends "base_admin.html" %}

{% block title %}Students{% endblock %}

{% block admin_content %}
<section class="space-y-4">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Students</h1>
        <a href="{% url 'students:add' %}" class="rounded bg-slate-900 px-4 py-2 text-white">Add student</a>
    </div>
    <div class="rounded-lg bg-white p-6 shadow">
        {% for student in students %}
            <p><a href="{% url 'students:detail' student.pk %}" class="font-medium text-slate-900">{{ student.full_name }}</a> - {{ student.course }}</p>
        {% empty %}
            <p>No students found yet.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
